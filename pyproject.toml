[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "researchmind"
version = "0.2.0"
description = "A multi-agent research assistant with document RAG and web research."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "google-genai>=1.0.0",
  "langgraph>=0.2.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "chromadb>=0.5.0",
  "ddgs>=9.0.0",
  "pypdf>=5.0.0",
  "requests>=2.32.0",
  "beautifulsoup4>=4.12.0",
  "streamlit>=1.38.0",
  "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.6.0", "mypy>=1.11.0"]
ocr = ["PyMuPDF>=1.24.0", "pytesseract>=0.3.13", "Pillow>=10.0.0"]

[project.scripts]
researchmind-ingest = "researchmind.rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
